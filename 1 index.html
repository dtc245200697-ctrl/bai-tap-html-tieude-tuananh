<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Tạo Form đơn giản & Đăng ký học viên</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f9;
            margin: 20px;
            color: #333;
        }

        .form-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            margin: 0 auto 40px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            color: #2c3e50;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group label.inline-label {
            display: inline-block;
            font-weight: normal;
            margin-right: 15px;
            cursor: pointer;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            border-color: #3498db;
            outline: none;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        .btn-group {
            text-align: center;
            margin-top: 25px;
        }

        button, input[type="submit"], input[type="reset"] {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
        }

        input[type="submit"], button[type="submit"] {
            background-color: #27ae60;
            color: white;
        }

        input[type="submit"]:hover, button[type="submit"]:hover {
            background-color: #219150;
        }

        input[type="reset"], button[type="reset"] {
            background-color: #e74c3c;
            color: white;
        }

        input[type="reset"]:hover, button[type="reset"]:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <!-- ==================== PHẦN 1: FORM ĐƠN GIẢN ==================== -->
    <div class="form-container">
        <h2>Phần 1: Form Khảo Sát Đơn Giản</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="yourname">Họ và tên:</label>
                <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên..." required>
            </div>

            <div class="form-group">
                <label for="email_p1">Email:</label>
                <input type="email" id="email_p1" name="email" placeholder="Nhập địa chỉ email..." required>
            </div>

            <div class="form-group">
                <label>Sở thích:</label>
                <label class="inline-label"><input type="checkbox" name="hobby" value="sports"> Thể thao</label>
                <label class="inline-label"><input type="checkbox" name="hobby" value="music"> Âm nhạc</label>
                <label class="inline-label"><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>
                <label class="inline-label"><input type="checkbox" name="hobby" value="travel"> Du lịch</label>
            </div>

            <div class="btn-group">
                <input type="submit" value="Gửi thông tin">
                <input type="reset" value="Nhập lại">
            </div>
        </form>
    </div>


    <!-- ==================== PHẦN 2: FORM ĐĂNG KÝ HỌC VIÊN ==================== -->
    <div class="form-container">
        <h2>Phần 2: Form Đăng Ký Học Viên</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="fullname">Họ và tên:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="text" id="phone" name="phone" placeholder="0901234567" required>
            </div>

            <div class="form-group">
                <label for="birthday">Ngày sinh:</label>
                <input type="date" id="birthday" name="birthday" required>
            </div>

            <div class="form-group">
                <label>Giới tính:</label>
                <label class="inline-label"><input type="radio" name="gender" value="Nam" checked> Nam</label>
                <label class="inline-label"><input type="radio" name="gender" value="Nữ"> Nữ</label>
                <label class="inline-label"><input type="radio" name="gender" value="Khác"> Khác</label>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ:</label>
                <textarea id="address" name="address" placeholder="Nhập địa chỉ của bạn..."></textarea>
            </div>

            <div class="form-group">
                <label for="course">Khóa học:</label>
                <select id="course" name="course">
                    <option value="HTML & CSS">HTML & CSS</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Java">Java</option>
                    <option value="Python">Python</option>
                </select>
            </div>

            <div class="form-group">
                <label>Hình thức học:</label>
                <label class="inline-label"><input type="radio" name="study_type" value="Online" checked> Online</label>
                <label class="inline-label"><input type="radio" name="study_type" value="Offline"> Offline</label>
            </div>

            <div class="form-group">
                <label>Sở thích:</label>
                <label class="inline-label"><input type="checkbox" name="hobby" value="code"> Lập trình</label>
                <label class="inline-label"><input type="checkbox" name="hobby" value="game"> Chơi game</label>
                <label class="inline-label"><input type="checkbox" name="hobby" value="read"> Đọc sách</label>
            </div>

            <div class="form-group">
                <label for="note">Ghi chú:</label>
                <textarea id="note" name="note" placeholder="Ghi chú thêm (nếu có)..."></textarea>
            </div>

            <div class="btn-group">
                <button type="submit">Đăng ký</button>
                <button type="reset">Nhập lại</button>
            </div>
        </form>
    </div>

</body>
</html>
